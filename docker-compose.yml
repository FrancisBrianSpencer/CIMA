services:
  mongodb:
    image: mongo:7
    container_name: cima-mongodb
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["cima_mongo_data:/data/db"]
    networks: [cima-network]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: cima-backend
    environment:
      APP_PORT: 8080
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: cima
    ports: ["8080:8080"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [cima-network]
  frontend:
    build: ./frontend
    container_name: cima-frontend
    ports: ["5173:80"]
    depends_on: [backend]
    networks: [cima-network]
networks:
  cima-network:
    name: cima-network
volumes:
  cima_mongo_data:
    name: cima-mongo-data
