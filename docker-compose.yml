services:
  mongodb:
    image: mongo:7
    container_name: cima-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cima
    ports:
      - "27017:27017"
    volumes:
      - cima_mongo_data:/data/db
    networks:
      - cima-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cima-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-cima}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/oauth/google/callback}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT_ID: ${OAUTH_MICROSOFT_TENANT_ID:-common}
      OAUTH_MICROSOFT_REDIRECT_URI: ${OAUTH_MICROSOFT_REDIRECT_URI:-http://localhost:8080/auth/oauth/microsoft/callback}
      OAUTH_FRONTEND_REDIRECT_URI: ${OAUTH_FRONTEND_REDIRECT_URI:-http://localhost:5173/}
      OAUTH_ALLOWED_DOMAINS: ${OAUTH_ALLOWED_DOMAINS:-}
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cima-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: cima-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cima-network

  backend-integration:
    build:
      context: ./backend
    profiles: ["integration"]
    environment:
      APP_ENV: test
      APP_PORT: 8081
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: cima_integration
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: integration-only-secret
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cima-network

  integration-tests:
    build:
      context: ./backend
      target: builder
    profiles: ["integration"]
    command: ["go", "test", "./...", "-run", "^TestAPIIntegration$", "-count=1"]
    environment:
      API_BASE_URL: http://backend-integration:8081
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: cima_integration
    depends_on:
      backend-integration:
        condition: service_started
    networks:
      - cima-network

networks:
  cima-network:
    name: cima-network

volumes:
  cima_mongo_data:
    name: cima-mongo-data
